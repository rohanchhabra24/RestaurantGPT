name: CI

"on":
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Compile-check backend
        working-directory: backend
        run: python -m compileall -q app
      - name: Run pure-logic unit tests
        working-directory: backend
        run: pytest tests/ -v

  eval-golden-set:
    # Needs a live Supabase project + Anthropic key, so this only runs once
    # those are configured as repo secrets/variables (Settings -> Secrets
    # and variables -> Actions, plus EVAL_CI_ENABLED=true as a repo
    # variable). Until then this job is skipped rather than failing CI on
    # every PR for a secret that isn't set up yet.
    if: ${{ vars.EVAL_CI_ENABLED == 'true' }}
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run golden-set eval (fails CI below the pass threshold)
        working-directory: backend
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEMO_RESTAURANT_ID: ${{ vars.DEMO_RESTAURANT_ID }}
        run: python -m eval.run_eval

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (catches JSX/import errors; no secrets needed)
        working-directory: frontend
        run: npm run build
