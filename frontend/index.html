<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestaurantGPT</title>
    <script>
      // Runs before first paint so switching pages/reloading never flashes
      // the wrong theme — the toggle itself lives in Settings (UserMenu.jsx).
      try {
        var t = localStorage.getItem("rgpt-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
